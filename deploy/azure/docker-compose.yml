services:
  app:
    build: ../..
    restart: unless-stopped
    environment:
      KG_TOKEN: ${KG_TOKEN:?set in .env}
      KG_COMMIT: ${KG_COMMIT:-}
    volumes:
      - kgdata:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ['80:80', '443:443']
    command: caddy reverse-proxy --from ${KG_FQDN} --to app:7777
    volumes:
      - caddydata:/data
volumes:
  kgdata:
  caddydata:
